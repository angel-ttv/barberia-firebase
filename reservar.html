<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservar cita — Nivara Barber Shop</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  .booking-screen{min-height:100vh;display:grid;place-items:center;background:var(--ink);padding:24px;}
  .booking-card{width:100%;max-width:420px;background:var(--paper);border-radius:var(--radius);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4);}
  .booking-card__body{padding:30px 26px;}
  .confirm{text-align:center;padding:20px 6px;}
  .confirm__icon{font-size:40px;margin-bottom:10px;}
  .accountBar{display:flex;justify-content:space-between;align-items:center;font-size:12px;opacity:.6;margin-bottom:16px;}
  .accountBar a{text-decoration:underline;}
</style>
</head>
<body>

<div class="booking-screen">
  <div class="booking-card">
    <div class="pole-stripe"></div>
    <div class="booking-card__body">
      <div class="accountBar">
        <span id="saludoCliente">—</span>
        <span>
          <a href="portal-cliente.html">Mis citas</a> ·
          <a href="#" id="logoutLink">Salir</a>
        </span>
      </div>

      <div class="brand">
        <span class="brand__mark">Nivara</span>
        <span class="brand__sub">Reserva tu cita</span>
      </div>
      <p class="login-tagline">Elige servicio, barbero y horario.</p>

      <div id="formError" class="login-error"></div>

      <form id="bookingForm">
        <div class="field"><label for="servicio">Servicio</label><select id="servicio" required></select></div>
        <div class="field"><label for="barbero">Barbero</label><select id="barbero" required></select></div>
        <div class="grid-2">
          <div class="field"><label for="fecha">Fecha</label><input type="date" id="fecha" required></div>
          <div class="field"><label for="hora">Hora</label><input type="time" id="hora" required></div>
        </div>
        <button type="submit" class="btn btn-primary" id="bookBtn">Confirmar reserva</button>
      </form>

      <div id="confirmBox" class="confirm hidden">
        <div class="confirm__icon">✂</div>
        <h3 style="margin-bottom:6px;">¡Listo!</h3>
        <p style="font-size:13.5px; opacity:.7;">Tu cita quedó como <b>pendiente de confirmación</b>. Podrás verla en "Mis citas".</p>
        <a href="portal-cliente.html" class="btn btn-secondary" style="display:block;text-align:center;margin-top:16px;text-decoration:none;">Ver mis citas</a>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="js/reservar.js"></script>
</body>
</html>
